name: Research model ablation (which models improve the decision, read-only)

# Owner, 24 Nov 2026: "how many models actually improve the final decision". backend/app/research_ablation.py: every coin
# of a timeframe retrained with one model left out / one model alone / deep models added, each judged on the untouched test
# split (net R + walk-forward Brier). One job per timeframe x variant group. Read-only on production state: restores the
# engine state cache only (never saves it), no secrets, never runs the engine; results -> research-results/results/ablation-*.json.
on:
  workflow_dispatch:
    inputs:
      budget:
        description: "seconds for the replay part"
        default: "18000"
      tfs:
        description: 'timeframes as JSON, e.g. ["1d"]'
        default: '["15m", "1h", "4h", "12h", "1d", "3d"]'
      groups:
        description: 'variant groups as JSON, e.g. ["rf"] (rf = 1d confirm on both windows)'
        default: '["g1", "g2", "g3"]'

concurrency:
  group: research-ablation
  cancel-in-progress: true

jobs:
  research:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        tf: ${{ fromJSON(inputs.tfs) }}
        group: ${{ fromJSON(inputs.groups) }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write          # commit the JSON results to the research-results branch
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-worker.txt
            backend/requirements-torch.txt
      - run: pip install -r requirements-worker.txt
      - name: Install PyTorch (CPU) so saved models with LSTM / GRU / Transformer members load
        run: pip install -r requirements-torch.txt || echo "::warning::torch not installed"
      - name: Restore the engine state (read-only copy; never saved back)
        id: state
        uses: actions/cache/restore@v4
        with:
          path: backend/data
          key: engine-state-none
          restore-keys: engine-state-
      - name: Run the research
        env:
          DATABASE_URL: sqlite:///./data/crypto_ai.db
        run: |
          mkdir -p ../out
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          if [ -z "${{ steps.state.outputs.cache-matched-key }}" ] || [ ! -f data/crypto_ai.db ]; then
            printf '{"ok": false, "command": "ablation", "reason": "engine state cache not restored", "commit": "%s"}\n' "${GITHUB_SHA}" > ../out/ablation-${{ matrix.tf }}-${{ matrix.group }}-latest.json
          else
            python -m app.research ablation --timeframes ${{ matrix.tf }} --group ${{ matrix.group }} --budget "${{ github.event.inputs.budget || '18000' }}" --out ../out/ablation-${{ matrix.tf }}-${{ matrix.group }}-latest.json > /dev/null 2> ../err.txt \
              || python3 -c "import json,sys; print(json.dumps({'ok': False, 'command': 'ablation', 'reason': open('../err.txt').read()[-1500:]}))" > ../out/ablation-${{ matrix.tf }}-${{ matrix.group }}-latest.json
          fi
          cp ../out/ablation-${{ matrix.tf }}-${{ matrix.group }}-latest.json ../out/ablation-${{ matrix.tf }}-${{ matrix.group }}-$stamp.json
          echo "cache key: ${{ steps.state.outputs.cache-matched-key }}" > ../out/ablation-${{ matrix.tf }}-${{ matrix.group }}-source.txt
          echo "commit: ${GITHUB_SHA}" >> ../out/ablation-${{ matrix.tf }}-${{ matrix.group }}-source.txt
      - name: Commit the results to the research-results branch
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5 6 7 8; do
            rm -rf ../rr; git worktree prune
            if git ls-remote --exit-code --heads origin research-results >/dev/null 2>&1; then
              git fetch --depth 1 origin research-results
              git worktree add ../rr FETCH_HEAD
              git -C ../rr checkout -B research-results
            else
              git worktree add --detach ../rr
              git -C ../rr checkout --orphan research-results
              git -C ../rr rm -rf --quiet . || true
            fi
            mkdir -p ../rr/results
            cp out/* ../rr/results/
            (cd ../rr && git add results && { git commit -m "Model ablation results for ${GITHUB_SHA::7}" || exit 0; } && git push origin HEAD:research-results) && break
            sleep $((RANDOM % 20 + 5))
          done
