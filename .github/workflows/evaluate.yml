name: Evaluate accuracy (manual)

# Runs an out-of-sample accuracy experiment on the engine's stored real candles and saves the report to the
# `reports` branch (reports/latest.json). Read-only for the engine: its saved state is restored, never saved.
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Coins"
        default: "BTC/USDT,ETH/USDT,SOL/USDT,BNB/USDT,XRP/USDT"
      timeframes:
        description: "Timeframes"
        default: "1h,4h,1d"

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      EXCHANGE: binance_public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-worker.txt
            backend/requirements-torch.txt
      - run: pip install -r requirements-worker.txt
      - name: Restore engine state (read-only)
        uses: actions/cache/restore@v4
        with:
          path: backend/data
          key: engine-state-${{ github.run_id }}
          restore-keys: engine-state-
      - name: Run the experiment
        run: python -m app.evaluate --symbols "${{ inputs.symbols }}" --timeframes "${{ inputs.timeframes }}" --budget 2700 --out /tmp/report.json
      - name: Save the report to the reports branch
        working-directory: .
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch origin reports || true
          if git rev-parse --verify origin/reports >/dev/null 2>&1; then git switch -c reports origin/reports; else git switch --orphan reports; git rm -rf --quiet . || true; fi
          mkdir -p reports
          cp /tmp/report.json "reports/eval-$(date -u +%Y%m%d-%H%M).json"
          cp /tmp/report.json reports/latest.json
          git add reports
          git commit -m "Accuracy evaluation $(date -u +%F)"
          git push origin reports
