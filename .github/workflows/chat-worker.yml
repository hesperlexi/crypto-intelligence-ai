# v2.61 member AI chat: deploys chat-worker/ to Cloudflare Workers (free plan).
# Needs repository secrets CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers"), CLOUDFLARE_ACCOUNT_ID and
# CHAT_GEMINI_API_KEY (a Gemini key of its own, so chat never uses the engine's daily Gemini budget; falls back to
# GEMINI_API_KEY when missing). Without the Cloudflare secrets the job only says what is missing.
name: chat-worker
on:
  push:
    branches: [main]
    paths: ["chat-worker/**", ".github/workflows/chat-worker.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: chat-worker, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: chat-worker } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets present?
        id: chk
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set - chat worker not deployed"; echo "go=0" >> "$GITHUB_OUTPUT"
          else echo "go=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.go == '1'
        with: { node-version: 20 }
      - run: npm ci --no-audit --no-fund
        if: steps.chk.outputs.go == '1'
      - run: npx tsc --noEmit
        if: steps.chk.outputs.go == '1'
      - name: KV namespace (created once, title cia-chat)
        if: steps.chk.outputs.go == '1'
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          id=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api?per_page=100" | jq -r '.result[] | select(.title=="cia-chat") | .id' | head -1)
          if [ -z "$id" ]; then
            id=$(curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d '{"title":"cia-chat"}' "$api" | jq -r '.result.id')
          fi
          [ -n "$id" ] && [ "$id" != "null" ] || { echo "::error::could not get a KV namespace"; exit 1; }
          sed -i "s/__KV_ID__/$id/" wrangler.toml
      - name: workers.dev address (registered once)
        if: steps.chk.outputs.go == '1'
        id: sub
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          sub=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api" | jq -r '.result.subdomain // empty')
          if [ -z "$sub" ]; then
            for want in cryptointelai cia-chat-${CLOUDFLARE_ACCOUNT_ID:0:6}; do
              r=$(curl -sS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d "{\"subdomain\":\"$want\"}" "$api")
              if [ "$(echo "$r" | jq -r .success)" = "true" ]; then sub=$want; break; fi
              echo "::notice::subdomain $want refused: $(echo "$r" | jq -c '.errors')"
            done
          fi
          [ -n "$sub" ] || { echo "::error::no workers.dev subdomain"; exit 1; }
          echo "sub=$sub" >> "$GITHUB_OUTPUT"
      - name: Deploy
        if: steps.chk.outputs.go == '1'
        env:
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
        run: |
          set -o pipefail
          npx wrangler deploy --var "ADMIN_EMAILS:${ADMIN_EMAILS}" 2>&1 | tee deploy.log | grep -v -i token || { tail -20 deploy.log | grep -v -i token | sed 's/^/::error::/'; exit 1; }
          curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d '{"enabled":true}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/cia-chat/subdomain" | jq -c '.success' 
      - name: Edge key (v2.67; derived from the Firebase key, the engine derives the same one - never printed)
        if: steps.chk.outputs.go == '1'
        env:
          FSA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FSA" ]; then echo "::warning::no Firebase key - edge views off"; exit 0; fi
          printf '%s' "cia-edge-v1|$FSA" | sha256sum | cut -c1-64 | tr -d '\n' | npx wrangler secret put EDGE_KEY >/dev/null && echo "edge key set"
      - name: Gemini key
        if: steps.chk.outputs.go == '1'
        env:
          KEY: ${{ secrets.CHAT_GEMINI_API_KEY != '' && secrets.CHAT_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::warning::no Gemini key - the chat answers 'not set up yet'"; exit 0; fi
          printf '%s' "$KEY" | npx wrangler secret put GEMINI_API_KEY >/dev/null && echo "Gemini key set"
      - name: Address
        if: steps.chk.outputs.go == '1'
        run: |
          url="https://cia-chat.${{ steps.sub.outputs.sub }}.workers.dev"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
          # a brand-new workers.dev address needs a few minutes for its certificate
          h=""; for i in $(seq 1 40); do h=$(curl -s -m 10 "$url/health" || true); [ -n "$h" ] && break; sleep 15; done
          echo "::notice::chat url $url health ${h:-no answer yet} chat-no-token $(curl -s -m 10 -X POST "$url/chat" -d '{}' || true) diag $(curl -s -m 90 "$url/diag" || echo timeout) edge $(curl -s -m 20 "$url/edge-health" || echo timeout)"
