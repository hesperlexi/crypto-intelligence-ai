name: Research v2.13 (honest record + stricter grading impact, read-only)

# Impact of the v2.13 changes before they go live (python -m app.research v213, backend/app/research_v213.py):
#   * the live record since 30 Oct 2026 replayed with the old vs new entry / fill rules, gross and net of costs;
#   * the models' out-of-sample calls with current vs edge-required grading and old vs honest entry (test split).
# Read-only on production state: restores the engine state cache only (never saves it), no Firebase key or any other
# secret, never runs the engine; results are committed to the `research-results` branch under results/v213-*.json.
on:
  push:
    branches: [honest-v213]
    paths:
      - ".github/workflows/research-v213.yml"
      - "backend/app/research_v213.py"
  workflow_dispatch:
    inputs:
      budget:
        description: "seconds for the replay part"
        default: "10800"

concurrency:
  group: research-v213
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write          # commit the JSON results to the research-results branch
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-worker.txt
            backend/requirements-torch.txt
      - run: pip install -r requirements-worker.txt
      - name: Install PyTorch (CPU) so saved models with LSTM / GRU / Transformer members load
        run: pip install -r requirements-torch.txt || echo "::warning::torch not installed"
      - name: Restore the engine state (read-only copy; never saved back)
        id: state
        uses: actions/cache/restore@v4
        with:
          path: backend/data
          key: engine-state-none
          restore-keys: engine-state-
      - name: Run the research
        env:
          DATABASE_URL: sqlite:///./data/crypto_ai.db
        run: |
          mkdir -p ../out
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          if [ -z "${{ steps.state.outputs.cache-matched-key }}" ] || [ ! -f data/crypto_ai.db ]; then
            printf '{"ok": false, "command": "v213", "reason": "engine state cache not restored", "commit": "%s"}\n' "${GITHUB_SHA}" > ../out/early-latest.json
          else
            python -m app.research early --budget "${{ github.event.inputs.budget || '10800' }}" --out ../out/early-latest.json > /dev/null \
              || printf '{"ok": false, "command": "v213", "reason": "the v213 research failed (see the job log)", "commit": "%s"}\n' "${GITHUB_SHA}" > ../out/early-latest.json
          fi
          cp ../out/early-latest.json ../out/early-$stamp.json
          echo "cache key: ${{ steps.state.outputs.cache-matched-key }}" > ../out/early-source.txt
          echo "commit: ${GITHUB_SHA}" >> ../out/early-source.txt
      - name: Commit the results to the research-results branch
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            rm -rf ../rr; git worktree prune
            if git ls-remote --exit-code --heads origin research-results >/dev/null 2>&1; then
              git fetch --depth 1 origin research-results
              git worktree add ../rr FETCH_HEAD
              git -C ../rr checkout -B research-results
            else
              git worktree add --detach ../rr
              git -C ../rr checkout --orphan research-results
              git -C ../rr rm -rf --quiet . || true
            fi
            mkdir -p ../rr/results
            cp out/* ../rr/results/
            (cd ../rr && git add results && { git commit -m "Research v2.13 results for ${GITHUB_SHA::7}" || exit 0; } && git push origin HEAD:research-results) && break
            sleep 10
          done
