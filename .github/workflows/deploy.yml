name: Test and deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-worker.txt
            backend/requirements-torch.txt
      - run: pip install -r requirements-worker.txt
      - name: Install PyTorch (CPU) for the LSTM / GRU / Transformer models
        run: pip install -r requirements-torch.txt
      - run: python -m pytest -q

  android:
    # Android app (Trusted Web Activity): a real APK that opens the live site in Chrome, so it always shows the
    # newest version; rebuilt on every deploy so a changed name or icon reaches the APK too.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Signing key (created once, kept privately in Firestore)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          pip install --quiet firebase-admin
          python3 scripts/android_key.py android/android.keystore
      - name: Build the APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          exec > >(tee build.log) 2>&1
          set -x
          ver=$(python3 -c 'import json;print(json.load(open("../frontend/package.json"))["version"])')   # one source: frontend/package.json
          sed -e "s/__VERSION_NAME__/${ver}/g" -e "s/__VERSION_CODE__/${GITHUB_RUN_NUMBER}/" twa-manifest.template.json > twa-manifest.json
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\": \"${JAVA_HOME}\", \"androidSdkPath\": \"${ANDROID_SDK_ROOT:-$ANDROID_HOME}\"}" > ~/.bubblewrap/config.json
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          # Bubblewrap looks for the SDK tools in <sdk>/tools (older layout); point it at the runner's cmdline-tools
          [ -e "$SDK/tools" ] || sudo ln -s "$SDK/cmdline-tools/latest" "$SDK/tools"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ls "$SDK/build-tools" | tail -3
          npm install -g @bubblewrap/cli@1.21.0 > /dev/null
          # icons come from this commit's files (the live site may still have the previous ones during the build)
          (cd ../frontend/public/icons && python3 -m http.server 8765 --bind 127.0.0.1 > /dev/null 2>&1 &)
          sleep 1
          bubblewrap update --skipVersionUpgrade
          python3 ../scripts/android_force_chrome.py
          bubblewrap build --skipPwaValidation
          mkdir -p out/.well-known out/download
          cp app-release-signed.apk out/download/crypto-intelligence-ai.apk
          printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.hesper.cryptoai","sha256_cert_fingerprints":["%s"]}}]\n' "$SHA256_FINGERPRINT" > out/.well-known/assetlinks.json
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/android/crypto-intelligence-ai.apk"
          echo "{\"version\": \"${ver}\", \"code\": ${GITHUB_RUN_NUMBER}, \"bytes\": $(stat -c%s out/download/crypto-intelligence-ai.apk), \"url\": \"${url}\"}" > out/download/android.json
      - name: Publish the APK on the repository's Releases page (the free Firebase plan does not host APK files)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android > /dev/null 2>&1 || gh release create android --title "Android app" \
            --notes "Crypto Intelligence AI for Android. Install the APK on your phone; it always opens the newest version of the app."
          gh release upload android android/out/download/crypto-intelligence-ai.apk --clobber
          gh release edit android --notes "Crypto Intelligence AI for Android, version $(python3 -c 'import json;print(json.load(open("android/out/download/android.json"))["version"])'). Install the APK on your phone; it always opens the newest version of the app."
          rm android/out/download/crypto-intelligence-ai.apk
      - name: Save the build log for troubleshooting
        if: failure()
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          cp android/build.log /tmp/android-build.log 2>/dev/null || echo "no build log" > /tmp/android-build.log
          git fetch origin reports && git switch -c reports origin/reports && mkdir -p reports \
            && tail -c 60000 /tmp/android-build.log > reports/android-build.log && git add reports \
            && git commit -qm "Android build log" && git push -q origin reports || true
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/out
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: [test, android]
    if: always() && needs.test.result == 'success'

    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build the website
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Add the Android app (if it built)
        if: needs.android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: android
          path: frontend/dist
      - name: Generate Firestore security rules
        env:
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
        run: python3 scripts/make_rules.py
      - name: Deploy to Firebase Hosting + Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "::error::Add the FIREBASE_SERVICE_ACCOUNT secret. See README."; exit 1; fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set -o pipefail
          if ! npx --yes firebase-tools@13 deploy --only hosting,firestore --project crypapp-6a9b9 --non-interactive 2>&1 | tee /tmp/deploy.log; then
            git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
            ls -la frontend/dist frontend/dist/download frontend/dist/.well-known >> /tmp/deploy.log 2>&1 || true
            git fetch origin reports && git switch -c reports origin/reports && mkdir -p reports && tail -c 30000 /tmp/deploy.log > reports/deploy.log \
              && git add reports && git commit -qm "Deploy log" && git push -q origin reports || true
            exit 1
          fi
          echo "Live at https://crypapp-6a9b9.web.app"
      - name: Check the live site serves this exact build (what the app's auto-update relies on)
        run: |
          want=$(cat frontend/dist/version.json)
          ok=""
          for i in $(seq 1 12); do
            got=$(curl -fsS "https://crypapp-6a9b9.web.app/version.json?t=$(date +%s%N)" || true)
            if [ "$got" = "$want" ]; then ok=1; break; fi
            sleep 10
          done
          {
            echo "deployed: $want"; echo "live:     $got"; echo
            for u in / /futures /sw.js /version.json /manifest.webmanifest /icons/icon-512.png; do
              echo "== $u"; curl -sSI "https://crypapp-6a9b9.web.app$u" | grep -iE "^(HTTP|cache-control|content-type)" ; done
            echo "== manifest icons"; curl -fsS "https://crypapp-6a9b9.web.app/manifest.webmanifest" | grep -o '"src": *"[^"]*"' | head -3
            echo "== update check present in the bundle"; grep -l "version.json" frontend/dist/assets/*.js | head -1
          } > /tmp/live.txt
          cat /tmp/live.txt
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git fetch origin reports && git switch -c reports origin/reports && mkdir -p reports && cp /tmp/live.txt reports/live-check.txt \
            && git add reports && git commit -qm "Live check $(date -u +%FT%H:%M)" && git push -q origin reports || true
          if [ -z "$ok" ]; then echo "::error::The live site does not serve the new build yet"; exit 1; fi

