name: Engine (every 15 minutes)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: engine            # one engine run at a time; they share the cached state
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      EXCHANGE: binance_public
      ENABLE_DEEP_MODELS: "true"
      FIREBASE_PROJECT_ID: crypapp-6a9b9
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
      SYMBOLS: ${{ vars.SYMBOLS || 'BTC/USDT,ETH/USDT,BNB/USDT,SOL/USDT,XRP/USDT,ADA/USDT,DOGE/USDT,AVAX/USDT,LINK/USDT,SUI/USDT' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the Firebase key is set
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT secret (Settings > Secrets and variables > Actions). See README."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-worker.txt
            backend/requirements-torch.txt
      - run: pip install -r requirements-worker.txt
      - name: Install PyTorch (CPU) for the LSTM / GRU / Transformer models
        run: pip install -r requirements-torch.txt
      - name: Restore engine state (candles, models, bot books)
        uses: actions/cache/restore@v4
        with:
          path: backend/data
          key: engine-state-${{ github.run_id }}
          restore-keys: engine-state-
      - name: Run one engine cycle
        run: python -m app.worker tick --budget 840
      - name: Save engine state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: backend/data
          key: engine-state-${{ github.run_id }}-${{ github.run_attempt }}
