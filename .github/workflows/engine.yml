name: Engine (every 5 minutes)

on:
  schedule:
    - cron: "*/5 * * * *"     # a run starts as soon as the previous one ends (about every 5-8 minutes)
  workflow_dispatch:

concurrency:
  group: engine            # one engine run at a time; they share the cached state
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # encrypted backup as a release asset (only when the daily one is missing)
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      EXCHANGE: binance_public
      ENABLE_DEEP_MODELS: "true"
      FIREBASE_PROJECT_ID: crypapp-6a9b9
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
      SYMBOLS: ${{ vars.SYMBOLS || 'BTC/USDT,ETH/USDT,BNB/USDT,SOL/USDT,XRP/USDT,ADA/USDT,DOGE/USDT,AVAX/USDT,LINK/USDT,SUI/USDT' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the Firebase key is set
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT secret (Settings > Secrets and variables > Actions). See README."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-worker.txt
            backend/requirements-torch.txt
      - run: pip install -r requirements-worker.txt
      - name: Install PyTorch (CPU) for the LSTM / GRU / Transformer models
        run: pip install -r requirements-torch.txt
      - name: Restore engine state (candles, models, bot books)
        id: state
        uses: actions/cache/restore@v4
        with:
          path: backend/data
          key: engine-state-${{ github.run_id }}
          restore-keys: engine-state-
      - name: Restore from the encrypted backup if the cache is gone
        if: steps.state.outputs.cache-matched-key == ''
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/engine_backup.sh restore || echo "::warning::backup restore failed; starting fresh"
      - name: Run one engine cycle
        run: python -m app.worker tick --budget 300
      - name: Save engine state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: backend/data
          key: engine-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Make sure an encrypted backup from the last day exists
        if: success()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/engine_backup.sh ensure || echo "::warning::backup failed; will retry next run"
