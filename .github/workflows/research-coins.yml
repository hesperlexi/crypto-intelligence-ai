name: Research coins (candidate coin study, read-only)

# v2.33 (owner, 14 Nov 2026): which new coins would give the app better results? backend/app/research_coins.py.
# One job per candidate (listings on Binance / MEXC, candles, nightly-style training on 15m / 1h / 4h, replay of the
# test split with the live rules and 0.15 % costs) + one baseline job (the watchlist coins' own models), then a summary.
# Read-only on production: restores the engine state cache only (never saves it), no secrets; results go to the
# `research-results` branch as results/coins-*.json (aggregates only).
on:
  push:
    branches: [coins-v233]
    paths:
      - ".github/workflows/research-coins.yml"
      - "backend/app/research_coins.py"
  workflow_dispatch:

concurrency:
  group: research-coins
  cancel-in-progress: true

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        coin: [baseline, BCH, ETC, HBAR, ATOM, FIL, APT, ARB, OP, INJ, TIA, SEI, FET, RENDER, TAO, WLD, SHIB, BONK, WIF]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-worker.txt
            backend/requirements-torch.txt
      - run: pip install -r requirements-worker.txt
      - name: Install PyTorch (CPU)
        run: pip install -r requirements-torch.txt || echo "::warning::torch not installed"
      - name: Restore the engine state (read-only copy; never saved back)
        id: state
        uses: actions/cache/restore@v4
        with:
          path: backend/data
          key: engine-state-none
          restore-keys: engine-state-
      - name: Run
        env:
          DATABASE_URL: sqlite:///./data/crypto_ai.db
          EXCHANGE: binance_public
        run: |
          mkdir -p ../out
          c="${{ matrix.coin }}"
          if [ -z "${{ steps.state.outputs.cache-matched-key }}" ] || [ ! -f data/crypto_ai.db ]; then
            printf '{"ok": false, "coin": "%s", "reason": "engine state cache not restored"}\n' "$c" > ../out/$c.json
          elif [ "$c" = baseline ]; then
            timeout 19000 python -m app.research coin-baseline --budget 16000 --out ../out/$c.json > /dev/null \
              || printf '{"ok": false, "coin": "baseline", "reason": "baseline failed or ran out of time"}\n' > ../out/$c.json
          else
            timeout 19000 python -m app.research coin-candidate --symbols "$c/USDT" --budget 3600 --out ../out/$c.json > /dev/null \
              || printf '{"ok": false, "coin": "%s", "reason": "study failed or ran out of time"}\n' "$c" > ../out/$c.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: coin-${{ matrix.coin }}
          path: out/${{ matrix.coin }}.json

  summary:
    needs: study
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Combine and commit to research-results
        run: |
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p out
          python3 - "$stamp" <<'PY'
          import json, pathlib, sys
          parts = {}
          for f in sorted(pathlib.Path("parts").glob("*/*.json")):
              try:
                  parts[f.stem] = json.loads(f.read_text())
              except Exception as exc:
                  parts[f.stem] = {"ok": False, "reason": str(exc)[:200]}
          out = {"stamp": sys.argv[1], "commit": "${{ github.sha }}", "baseline": parts.pop("baseline", None), "candidates": parts}
          pathlib.Path("out/coins-latest.json").write_text(json.dumps(out, indent=1))
          pathlib.Path(f"out/coins-{sys.argv[1]}.json").write_text(json.dumps(out, indent=1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            rm -rf ../rr; git worktree prune
            git fetch --depth 1 origin research-results
            git worktree add ../rr FETCH_HEAD
            git -C ../rr checkout -B research-results
            mkdir -p ../rr/results
            cp out/* ../rr/results/
            (cd ../rr && git add results && { git commit -m "Coin study results for ${GITHUB_SHA::7}" || exit 0; } && git push origin HEAD:research-results) && break
            sleep 10
          done
