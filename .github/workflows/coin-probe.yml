name: Coin probe (manual)
# Read-only: what the live app shows about one coin (signals, bot positions, analysis) -> reports/coin.json
on:
  workflow_dispatch:
    inputs:
      coin: { description: "e.g. SOL/USDT", required: true, default: "SOL/USDT" }
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet firebase-admin
      - env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python scripts/coin_probe.py "${{ inputs.coin }}" > /tmp/coin.json
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git fetch origin reports && git switch -c reports origin/reports && mkdir -p reports
          cp /tmp/coin.json reports/coin.json && git add reports && git commit -qm "Coin probe" && (for i in 1 2 3 4 5; do git pull -q --rebase origin reports && git push -q origin reports && break; sleep $((i*4)); done)
