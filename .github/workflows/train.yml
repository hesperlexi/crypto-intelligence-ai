name: Train models (daily)

on:
  schedule:
    - cron: "17 2 * * *"     # 02:17 UTC every day
  workflow_dispatch:

concurrency:
  group: engine
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # the daily encrypted backup is stored as a release asset
    timeout-minutes: 80
    defaults:
      run:
        working-directory: backend
    env:
      EXCHANGE: binance_public
      ENABLE_DEEP_MODELS: "true"
      FIREBASE_PROJECT_ID: crypapp-6a9b9
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SYMBOLS: ${{ vars.SYMBOLS || 'BTC/USDT,ETH/USDT,BNB/USDT,SOL/USDT,XRP/USDT,ADA/USDT,DOGE/USDT,AVAX/USDT,LINK/USDT,SUI/USDT' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-worker.txt
            backend/requirements-torch.txt
      - run: pip install -r requirements-worker.txt
      - name: Install PyTorch (CPU) for the LSTM / GRU / Transformer models
        run: pip install -r requirements-torch.txt
      - id: state
        uses: actions/cache/restore@v4
        with:
          path: backend/data
          key: engine-state-${{ github.run_id }}
          restore-keys: engine-state-
      - name: Restore from the encrypted backup if the cache is gone
        if: steps.state.outputs.cache-matched-key == ''
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/engine_backup.sh restore || echo "::warning::backup restore failed; starting fresh"
      - name: Train / refresh models (full model set incl. LSTM / GRU / Transformer, 60-minute budget; the rest continues tomorrow)
        run: python -m app.worker train --budget 3600
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: backend/data
          key: engine-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Daily encrypted backup of the engine state
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/engine_backup.sh save
