name: Operations review (read-only)
# Counts only: record per timeframe before / after the 26 Nov update, filters that held calls back, engine skips,
# guard state, and a fresh analysis of every coin now. Runs on a copy of the engine state; nothing is published or saved.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend
    env:
      EXCHANGE: binance_public
      ENABLE_DEEP_MODELS: "false"
      SYMBOLS: ${{ vars.SYMBOLS || 'BTC/USDT,ETH/USDT,BNB/USDT,SOL/USDT,XRP/USDT,ADA/USDT,DOGE/USDT,AVAX/USDT,LINK/USDT,SUI/USDT' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-worker.txt
            backend/requirements-torch.txt
      - run: pip install -r requirements-worker.txt && pip install -r requirements-torch.txt
      - uses: actions/cache/restore@v4
        with:
          path: backend/data
          key: engine-state-ops-${{ github.run_id }}
          restore-keys: engine-state-
      - name: Review
        run: |
          timeout 1800 python ../scripts/ops_review.py > /tmp/ops.json 2> /tmp/ops.err || echo "exit $?" >> /tmp/ops.err
          tail -c 1500 /tmp/ops.err
          python3 -c "
          import json
          try: s = json.dumps(json.load(open('/tmp/ops.json')), separators=(',', ':'))
          except Exception as e: s = 'bad output ' + open('/tmp/ops.err').read()[-3000:]
          for i in range(0, min(len(s), 60000), 3500): print('::notice title=part' + str(i // 3500).zfill(2) + '::' + s[i:i + 3500])
          "
