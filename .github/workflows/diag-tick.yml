name: Diagnose one engine cycle (manual)
# Runs one cycle on a copy of the engine state with stack dumps every 2 minutes; "local" mode publishes nothing.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "local (no publishing) or live"
        default: local
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      EXCHANGE: binance_public
      ENABLE_DEEP_MODELS: "false"
      FIREBASE_PROJECT_ID: crypapp-6a9b9
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-worker.txt
            backend/requirements-torch.txt
      - run: pip install -r requirements-worker.txt && pip install -r requirements-torch.txt
      - uses: actions/cache/restore@v4
        with:
          path: backend/data
          key: engine-state-diag-${{ github.run_id }}
          restore-keys: engine-state-
      - name: One cycle with stack dumps
        run: |
          ARGS=""; [ "${{ inputs.mode }}" = "live" ] || ARGS="--local /tmp/diag-out"
          timeout 1200 python ../scripts/diag_tick.py $ARGS > /tmp/diag.log 2>&1 || echo "exit $?" >> /tmp/diag.log
          tail -c 60000 /tmp/diag.log
      - if: always()
        working-directory: .
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git fetch origin reports && git switch -c reports origin/reports && mkdir -p reports
          tail -c 200000 /tmp/diag.log > reports/diag-tick.log; git add reports && git commit -qm "Diag tick" && (for i in 1 2 3 4 5; do git pull -q --rebase origin reports && git push -q origin reports && break; sleep $((i*4)); done)
