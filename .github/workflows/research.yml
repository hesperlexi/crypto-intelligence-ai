name: Research (read-only replays of the recorded calls)

# Audit v1 proof: replays every recorded call on the stored candles with the current rules (give-back baseline) and
# compares them with the managed exits on a tuning / untouched test split. Read-only on production state:
#   * restores the engine state cache only (never saves it), no Firebase key or any other secret, never runs the engine;
#   * results are committed to the `research-results` branch under results/.
on:
  push:
    branches: [audit-v1-upgrade, engine-v26, research-v27]
    paths:
      - "backend/**"
      - ".github/workflows/research.yml"
  workflow_dispatch:
    inputs:
      commands:
        description: "research commands to run (space separated: giveback compare engine models)"
        required: false
        default: "giveback compare engine"

concurrency:
  group: research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 340      # engine proof 4 h budget; models study 4 h 20 min budget (--budget), checkpointed
    permissions:
      contents: write          # commit the JSON results to the research-results branch
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-worker.txt
            backend/requirements-torch.txt
      - run: pip install -r requirements-worker.txt
      - name: Install PyTorch (CPU) so saved models with LSTM / GRU / Transformer members load
        run: pip install -r requirements-torch.txt || echo "::warning::torch not installed"
      - name: Restore the engine state (read-only copy; never saved back)
        id: state
        uses: actions/cache/restore@v4
        with:
          path: backend/data
          key: engine-state-none
          restore-keys: engine-state-
      - name: Run the research
        env:
          DATABASE_URL: sqlite:///./data/crypto_ai.db
          # v2.7 branch: only the model study (python -m app.research models); elsewhere the v2.6 set
          COMMANDS: ${{ github.event.inputs.commands || (github.ref_name == 'research-v27' && 'models' || 'giveback compare engine') }}
        run: |
          mkdir -p ../out
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          echo "commands: $COMMANDS"
          if [ -z "${{ steps.state.outputs.cache-matched-key }}" ] || [ ! -f data/crypto_ai.db ]; then
            for c in $COMMANDS; do
              printf '{"ok": false, "command": "%s", "reason": "engine state cache not restored (no engine-state-* cache available)", "commit": "%s"}\n' "$c" "${GITHUB_SHA}" > ../out/$c-latest.json
            done
          else
            for c in $COMMANDS; do
              case "$c" in
                giveback|compare) python -m app.research $c --out ../out/$c-latest.json > /dev/null ;;
                # v2.6 proof: OLD pipeline vs each change vs all proven changes on an untouched 30 % test split
                engine) python -m app.research engine --budget 14400 --out ../out/engine-latest.json > /dev/null \
                  || printf '{"ok": false, "command": "engine", "reason": "the engine research failed (see the job log)", "commit": "%s"}\n' "${GITHUB_SHA}" > ../out/engine-latest.json ;;
                # v2.7: CURRENT vs trade-outcome labels (A) vs pooled models (B) vs A+B; per-timeframe checkpoints in --out
                models) timeout 18600 python -m app.research models --budget 15600 --out ../out/models-latest.json > /dev/null \
                  || { [ -s ../out/models-latest.json ] || printf '{"ok": false, "command": "models", "reason": "the models research failed (see the job log)", "commit": "%s"}\n' "${GITHUB_SHA}" > ../out/models-latest.json; } ;;
              esac
            done
          fi
          for c in $COMMANDS; do [ -f ../out/$c-latest.json ] && cp ../out/$c-latest.json ../out/$c-$stamp.json; done
          echo "cache key: ${{ steps.state.outputs.cache-matched-key }}" > ../out/source.txt
          echo "commit: ${GITHUB_SHA}" >> ../out/source.txt
      - name: Commit the results to the research-results branch
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin research-results >/dev/null 2>&1; then
            git fetch --depth 1 origin research-results
            git worktree add ../rr FETCH_HEAD
            git -C ../rr checkout -B research-results
          else
            git worktree add --detach ../rr
            git -C ../rr checkout --orphan research-results
            git -C ../rr rm -rf --quiet . || true
          fi
          mkdir -p ../rr/results
          [ -n "$(ls -A out 2>/dev/null)" ] || { echo "no results"; exit 0; }
          cp out/* ../rr/results/
          cd ../rr
          git add results
          git commit -m "Research results for ${GITHUB_SHA::7}" || { echo "nothing new"; exit 0; }
          git push origin HEAD:research-results
