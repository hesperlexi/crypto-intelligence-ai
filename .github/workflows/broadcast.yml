name: Broadcast notification (manual, owner only)
# Sends one push notification to every device that turned notifications on. Manual only: the owner's message.
on:
  workflow_dispatch:
    inputs:
      title: { description: "Title", required: true }
      body: { description: "Message (max 300 characters)", required: true }
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet firebase-admin numpy pandas
      - env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: crypapp-6a9b9
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          DATABASE_URL: sqlite:///./broadcast.db
          T: ${{ github.event.inputs.title }}
          B: ${{ github.event.inputs.body }}
        run: |
          python - <<'PY'
          import json, os
          from app.db import get_db
          from app.sinks import FirestoreSink
          sink = FirestoreSink(get_db(), os.environ["FIREBASE_PROJECT_ID"])
          msg = {"title": os.environ["T"][:80], "body": os.environ["B"][:300], "url": "/", "tag": "broadcast", "broadcast": True}
          print(json.dumps(sink.send_push([msg])))
          PY
