name: Probe data sources (manual)

# Which futures-market data sources can the engine's runners reach? Results go to the reports branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          D=$(date -u -d '2 days ago' +%F); M=$(date -u -d '1 month ago' +%Y-%m); S=$(( ($(date +%s) - 86400) * 1000 ))
          probe() { code=$(curl -s -m 15 -o /tmp/b -w '%{http_code}' "$@"); printf '{"url":"%s","code":"%s","body":%s}\n' "${@: -1}" "$code" "$(head -c 300 /tmp/b | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')"; }
          {
          probe "https://fapi.binance.com/fapi/v1/fundingRate?symbol=BTCUSDT&limit=2"
          probe "https://fapi.binance.com/futures/data/openInterestHist?symbol=BTCUSDT&period=1h&limit=2"
          probe -I "https://data.binance.vision/data/futures/um/monthly/fundingRate/BTCUSDT/BTCUSDT-fundingRate-$M.zip"
          probe -I "https://data.binance.vision/data/futures/um/daily/metrics/BTCUSDT/BTCUSDT-metrics-$D.zip"
          probe -I "https://data.binance.vision/data/futures/um/daily/premiumIndexKlines/BTCUSDT/1h/BTCUSDT-1h-$D.zip"
          probe -X POST -H 'content-type: application/json' -d "{\"type\":\"fundingHistory\",\"coin\":\"BTC\",\"startTime\":$S}" "https://api.hyperliquid.xyz/info"
          probe "https://www.okx.com/api/v5/public/funding-rate-history?instId=BTC-USDT-SWAP&limit=2"
          probe "https://www.okx.com/api/v5/rubik/stat/contracts/open-interest-volume?ccy=BTC&period=1H"
          probe "https://api.bybit.com/v5/market/funding/history?category=linear&symbol=BTCUSDT&limit=2"
          probe "https://api.gateio.ws/api/v4/futures/usdt/funding_rate?contract=BTC_USDT&limit=2"
          probe "https://contract.mexc.com/api/v1/contract/funding_rate/history?symbol=BTC_USDT&page_size=2"
          probe "https://api.kraken.com/0/public/Time"
          } > /tmp/probe.jsonl
          cat /tmp/probe.jsonl | cut -c1-200
      - name: Save to the reports branch
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git fetch origin reports || true
          git switch -c reports origin/reports
          mkdir -p reports; cp /tmp/probe.jsonl reports/probe-latest.jsonl
          git add reports; git commit -m "Data source probe $(date -u +%F)"; git push origin reports
