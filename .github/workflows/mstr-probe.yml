name: MSTR data probe (manual, read-only)
# Can the engine's runner reach MSTR perpetual candles (MEXC futures, Binance futures / archive)? Counts only -> reports/mstr-probe.json
on:
  workflow_dispatch:
  push:
    branches: [mstr-signals]
    paths: [".github/workflows/mstr-probe.yml", "scripts/mstr_probe.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet requests
      - run: python scripts/mstr_probe.py > /tmp/mstr.json; cat /tmp/mstr.json
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git fetch origin reports && git switch -c reports origin/reports && mkdir -p reports
          cp /tmp/mstr.json reports/mstr-probe.json && git add reports && git commit -qm "MSTR probe" && (for i in 1 2 3 4 5; do git pull -q --rebase origin reports && git push -q origin reports && break; sleep $((i*4)); done)
