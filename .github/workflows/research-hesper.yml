name: Research - 30-day Hesper challenge odds (read-only)

# How often would a 30-day Hesper challenge ($100 -> $1,000) have succeeded? Replays the models' out-of-sample grade-A
# calls (live decision, entry, filter and publication rules) and the real recorded grade-A calls through 30-day windows
# that mirror services/hesper.py (all-in vs fixed-risk sizing). Read-only on production state:
#   * restores the engine state cache only (never saves it), no Firebase key or any other secret, never runs the engine;
#   * results are committed to the `research-results` branch as results/hesper-<stamp>.json and hesper-latest.json.
on:
  push:
    branches: [hesper-rich]
    paths:
      - "backend/app/research_hesper.py"
      - ".github/workflows/research-hesper.yml"
  workflow_dispatch:

concurrency:
  group: research-hesper        # own group: never cancels the other research workflows
  cancel-in-progress: true

jobs:
  hesper:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    permissions:
      contents: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements-worker.txt
            backend/requirements-torch.txt
      - run: pip install -r requirements-worker.txt
      - name: Install PyTorch (CPU) so saved models with LSTM / GRU / Transformer members load
        run: pip install -r requirements-torch.txt || echo "::warning::torch not installed"
      - name: Restore the engine state (read-only copy; never saved back)
        id: state
        uses: actions/cache/restore@v4
        with:
          path: backend/data
          key: engine-state-none
          restore-keys: engine-state-
      - name: Run the Hesper research
        env:
          DATABASE_URL: sqlite:///./data/crypto_ai.db
        run: |
          mkdir -p ../out
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          if [ -z "${{ steps.state.outputs.cache-matched-key }}" ] || [ ! -f data/crypto_ai.db ]; then
            printf '{"ok": false, "command": "hesper", "reason": "engine state cache not restored"}\n' > ../out/hesper-latest.json
          else
            python -m app.research hesper --budget 7200 --out ../out/hesper-latest.json > /dev/null 2> ../out/hesper.err \
              || python -c "import json; e=open('../out/hesper.err').read()[-4000:]; json.dump({'ok': False, 'command': 'hesper', 'reason': 'the hesper research failed', 'stderr_tail': e}, open('../out/hesper-latest.json', 'w'))"
          fi
          python - <<'EOF'
          import json
          d = json.load(open("../out/hesper-latest.json"))
          d["commit"] = "${{ github.sha }}"
          d["cache_key"] = "${{ steps.state.outputs.cache-matched-key }}"
          json.dump(d, open("../out/hesper-latest.json", "w"), indent=1)
          EOF
          cp ../out/hesper-latest.json ../out/hesper-$stamp.json
      - name: Commit the results to the research-results branch
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            rm -rf ../rr; git worktree prune
            if git ls-remote --exit-code --heads origin research-results >/dev/null 2>&1; then
              git fetch --depth 1 origin research-results
              git worktree add ../rr FETCH_HEAD
              git -C ../rr checkout -B research-results
            else
              git worktree add --detach ../rr
              git -C ../rr checkout --orphan research-results
              git -C ../rr rm -rf --quiet . || true
            fi
            mkdir -p ../rr/results
            cp out/hesper-*.json ../rr/results/
            ( cd ../rr && git add -A results/ && \
              { git commit -m "Hesper 30-day research results for ${GITHUB_SHA::7}" || { echo "nothing new"; exit 0; }; } && \
              git push origin HEAD:research-results ) && exit 0
            echo "push failed (another run committed meanwhile), retrying"; sleep $((attempt * 10))
          done
          exit 1
