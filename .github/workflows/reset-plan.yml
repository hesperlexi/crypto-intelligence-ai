name: v1.0.0 reset plan (read-only count)

# Counts what the one-time v1.0.0 fresh start (backend/app/reset_v1.py) would remove. Read-only:
#   * restores a copy of the engine state cache (never saves it) and only lists Firestore documents;
#   * the counts are committed to the research-results branch as results/reset-plan.json.
on:
  push:
    branches: [reset-v1]
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-worker.txt
      - run: pip install -r requirements-worker.txt
      - name: Restore the engine state (read-only copy; never saved back)
        id: state
        uses: actions/cache/restore@v4
        with:
          path: backend/data
          key: engine-state-none
          restore-keys: engine-state-
      - name: Count
        env:
          DATABASE_URL: sqlite:///./data/crypto_ai.db
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: crypapp-6a9b9
        run: |
          mkdir -p ../out
          python -m app.reset_v1 dry-run > ../out/reset-plan.json 2> ../out/reset-plan.err || true
          echo "cache key: ${{ steps.state.outputs.cache-matched-key }}" >> ../out/reset-plan.err
      - name: Commit the counts to the research-results branch
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth 1 origin research-results
          git worktree add ../rr FETCH_HEAD
          git -C ../rr checkout -B research-results
          mkdir -p ../rr/results && cp out/* ../rr/results/
          cd ../rr && git add results && git commit -m "Reset plan for ${GITHUB_SHA::7}" && git push origin HEAD:research-results
