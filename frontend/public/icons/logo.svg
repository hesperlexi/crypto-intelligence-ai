<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="35%" cy="25%" r="85%">
      <stop offset="0" stop-color="#2B3139"/>
      <stop offset="0.55" stop-color="#14171C"/>
      <stop offset="1" stop-color="#0B0E11"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE58A"/>
      <stop offset="0.35" stop-color="#FCD535"/>
      <stop offset="0.7" stop-color="#F0B90B"/>
      <stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.75" stop-color="#F0B90B" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#F0B90B" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BF5B4"/>
      <stop offset="1" stop-color="#0ECB81"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <path d="M112 3 H400 A109 109 0 0 1 509 112 V200 C380 250 160 170 3 230 V112 A109 109 0 0 1 112 3 Z" fill="url(#gloss)"/>
  <!-- the C: an open ring, gold, with circuit nodes -->
  <g filter="url(#glow)">
    <path d="M356 150 A148 148 0 1 0 356 362" fill="none" stroke="url(#gold)" stroke-width="50" stroke-linecap="round"/>
  </g>
  <g fill="#0B0E11" stroke="url(#gold)" stroke-width="7">
    <circle cx="150" cy="170" r="13"/>
    <circle cx="112" cy="256" r="13"/>
    <circle cx="150" cy="342" r="13"/>
  </g>
  <!-- candlesticks rising inside the C -->
  <g stroke-linecap="round">
    <line x1="214" y1="270" x2="214" y2="350" stroke="#F6465D" stroke-width="7"/>
    <rect x="198" y="286" width="32" height="48" rx="6" fill="#F6465D"/>
    <line x1="268" y1="222" x2="268" y2="326" stroke="url(#green)" stroke-width="7"/>
    <rect x="252" y="240" width="32" height="66" rx="6" fill="url(#green)"/>
    <line x1="322" y1="176" x2="322" y2="298" stroke="url(#green)" stroke-width="7"/>
    <rect x="306" y="194" width="32" height="84" rx="6" fill="url(#green)"/>
  </g>
  <!-- trend arrow breaking out through the opening of the C -->
  <g filter="url(#glow)" fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="176,330 236,282 286,300 410,168"/>
    <polyline points="356,164 412,166 410,222"/>
  </g>
  <!-- spark -->
  <g fill="#FFF3C4">
    <path d="M404 330 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7z"/>
  </g>
</svg>
