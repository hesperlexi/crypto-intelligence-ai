    <!-- v2.68: fonts load without holding up the first paint (system font until they arrive, display=swap) -->
    <noscript></noscript>
    <title>Crypto Intelligence AI</title>
    <script>
      // apply the saved theme before the first paint (no flash of the default colours)
      // 26 Nov 2026: remember whether this install is older than this code (it already had saved data) or brand new;
      // an old home-screen install still shows the previous icon (components/NotifyHelp IconUpdateBanner)
      try { if (!localStorage.getItem("cia-installed")) localStorage.setItem("cia-installed", localStorage.length ? "old" : String(Date.now())); } catch (e) {}
      try {
        // same rules as src/lib/appearance.tsx (ALIASES, THEMES, normalizeTheme, resolveTheme): keep them in step
        var a = JSON.parse(localStorage.getItem("cia-appearance-v2") || "{}"), t = typeof a.theme === "string" ? a.theme : "gold";
        t = ({ midnight: "gold", "midnight-gold": "gold", dark: "gold", ivory: "light" })[t] || t;
        if (["gold", "obsidian", "aurora", "violet", "light", "system"].indexOf(t) < 0) t = "gold";   // unknown / retired themes fall back to Midnight Gold
        if (t === "system") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches === false ? "light" : "gold";

        var d = document.documentElement; d.dataset.theme = t; d.dataset.density = a.densityChosen ? (a.density || "comfortable") : (window.matchMedia && matchMedia("(max-width: 767px)").matches ? "compact" : "comfortable"); d.dataset.glass = a.glass === false ? "off" : "on";
      } catch (e) {}
    </script>
