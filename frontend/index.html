<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#080b10" />
    <meta name="description" content="Crypto forecasting, market regimes, signals and demo trading bots. Analysis only." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Crypto AI" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>Crypto Intelligence AI</title>
    <script>
      // apply the saved theme before the first paint (no flash of the default colours)
      try {
        var a = JSON.parse(localStorage.getItem("cia-appearance") || "{}"), t = a.theme || "midnight";
        if (t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "midnight";
        var d = document.documentElement; d.dataset.theme = t; d.dataset.density = a.density || "comfortable"; d.dataset.glass = a.glass === false ? "off" : "on";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
