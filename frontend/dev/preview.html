<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e11" />
    <title>Preview · Crypto Intelligence AI</title>
    <script>
      try {
        var q = new URLSearchParams(location.search);
        if (q.get("preview")) sessionStorage.setItem("preview-as", q.get("preview"));
        if (q.get("theme")) localStorage.setItem("cia-appearance-v2", JSON.stringify({ theme: q.get("theme") }));
        if (q.get("mode")) localStorage.setItem("cia-view-mode", q.get("mode"));
        var a = JSON.parse(localStorage.getItem("cia-appearance-v2") || "{}"), t = typeof a.theme === "string" ? a.theme : "gold";
        t = ({ midnight: "gold", "midnight-gold": "gold", dark: "gold", ivory: "light" })[t] || t;
        if (["gold", "obsidian", "graphite", "aurora", "light", "system"].indexOf(t) < 0) t = "gold";
        if (t === "system") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches === false ? "light" : "gold";
        var d = document.documentElement; d.dataset.theme = t; d.dataset.density = a.density || "comfortable"; d.dataset.glass = a.glass === false ? "off" : "on";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/dev/preview.tsx"></script>
  </body>
</html>
