name: Train models (daily)

on:
  schedule:
    - cron: "17 2 * * *"     # 02:17 UTC every day
  workflow_dispatch:

concurrency:
  group: engine
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    env:
      EXCHANGE: binance_public
      FIREBASE_PROJECT_ID: crypapp-6a9b9
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      SYMBOLS: ${{ vars.SYMBOLS || 'BTC/USDT,ETH/USDT,BNB/USDT,SOL/USDT,XRP/USDT,ADA/USDT,DOGE/USDT,AVAX/USDT,LINK/USDT,SUI/USDT' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-worker.txt
      - run: pip install -r requirements-worker.txt
      - uses: actions/cache/restore@v4
        with:
          path: backend/data
          key: engine-state-${{ github.run_id }}
          restore-keys: engine-state-
      - name: Train / refresh models (full model set, 45-minute budget; the rest continues tomorrow)
        run: python -m app.worker train --budget 2700
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: backend/data
          key: engine-state-${{ github.run_id }}-${{ github.run_attempt }}
