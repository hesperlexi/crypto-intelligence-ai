# Optional override: store everything in TimescaleDB (PostgreSQL 16) instead of SQLite.
services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: crypto
      POSTGRES_DB: crypto_ai
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto -d crypto_ai"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://crypto:crypto@db:5432/crypto_ai

volumes:
  pg-data:
